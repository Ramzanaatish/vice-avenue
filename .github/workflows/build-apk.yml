# Build the Vice Avenue Android Debug APK.
# Runs on every push to main, or by hand from the Actions tab
# (Actions > Build Android Debug APK > Run workflow).
# The APK lands in the run's Artifacts as "ViceAvenue-debug-apk".
# Download it, copy it to the phone, tap to install.
# Repo layout: this file lives at .github/workflows/build-apk.yml
# and project.godot must sit at the repo root.

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Download export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Point Godot at the Android SDK
        # Godot reads the SDK/Java paths from its editor settings, not from
        # the environment. The ubuntu runner ships the SDK preinstalled
        # (ANDROID_SDK_ROOT) with build-tools and platform-tools included.
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "${JAVA_HOME_21_X64:-$JAVA_HOME}" > ~/.config/godot/editor_settings-4.7.tres
          test -x "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/apksigner" && echo "apksigner found"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" && echo "adb found"

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --import

      - name: Export debug APK
        run: |
          mkdir -p builds/android
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --export-debug "Android Debug" builds/android/ViceAvenue-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViceAvenue-debug-apk
          path: builds/android/ViceAvenue-debug.apk
          if-no-files-found: error
