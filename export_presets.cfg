; Export presets for Vice Avenue.
; Android Debug preset — Gate 1. The APK is built on Nelson's PC:
; Godot Editor > Project > Export... > Android Debug > Export Project.
; Requires the Android export templates (Editor > Manage Export
; Templates) + Android SDK configured on that PC. arm64-v8a only
; (covers modern phones); debug keystore, so no signing setup
; is needed for the first phone run.
; NOTE (Step 8): option names here are the Godot 4.7 names —
; gradle_build/* (not gradle/build/*), launcher_icons/* (not
; launcher/icon/*), architectures/* (not variant/architecture/*).
; The old slash forms are silently ignored by Godot 4.7, which
; cost Step 8 one failed AAB export before it was caught.

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/android/ViceAvenue-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86_64=false
architectures/x86=false
version/code=4
version/name="1.1.2"
package/unique_name="com.devflowia.viceavenue"
package/name="Vice Avenue"
keystore/debug=""
keystore/release=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release_user=""
keystore/release_password=""
launcher_icons/main_192x192="res://icon.png"
launcher_icons/adaptive_foreground_432x432="res://icon_adaptive_foreground.png"
launcher_icons/adaptive_background_432x432="res://icon_adaptive_background.png"
graphics/opengl_debug=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
gradle_build/use_gradle_build=false

; --- Step 8 (Phase 16) ---
; Android (Release AAB) preset — Play signing test only.
; AAB requires a Gradle build (legacy export is APK-only).
; Signing: the release keystore fields below are INTENTIONALLY
; EMPTY in this file. For the export check they come from env
; vars (GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER /
; _PASSWORD) pointing at Godot's debug keystore — TEST SIGNING
; ONLY. Before ANY Play upload, generate a real upload key
; (keytool -genkey) and put ITS path/alias/password in the env
; vars (never commit them); the debug keystore must NEVER be
; the upload key. Version code/name must stay in lock-step with
; VersionManager (see update_release_process.md).
; Install the Android build template first:
;   godot --headless --path . --install-android-build-template
; then: godot --headless --path . --export-release "Android (Release AAB)" builds/android/ViceAvenue-release.aab
; min_sdk/target_sdk are STRINGS in Godot 4.7 (not ints).

[preset.1]

name="Android (Release AAB)"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/android/ViceAvenue-release.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86_64=false
architectures/x86=false
version/code=4
version/name="1.1.2"
package/unique_name="com.devflowia.viceavenue"
package/name="Vice Avenue"
keystore/debug=""
keystore/release=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release_user=""
keystore/release_password=""
launcher_icons/main_192x192="res://icon.png"
launcher_icons/adaptive_foreground_432x432="res://icon_adaptive_foreground.png"
launcher_icons/adaptive_background_432x432="res://icon_adaptive_background.png"
graphics/opengl_debug=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
